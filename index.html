<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echoes of the Fallen Star</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --frame: #0a0d16;
      --frame-edge: #232a3d;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05070c;
      color: #cfd6e6;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    /*
     * The game fills the window. #app, #stage-wrap, #game-frame and
     * #game-container are all full-bleed, because Phaser's RESIZE scale mode
     * measures the canvas' parent element — anything that shrink-wraps the
     * canvas (padding, flex centring, a decorative frame) would become the
     * play area instead of the viewport.
     */
    #app {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, #131a2c 0%, #070a12 55%, #04060a 100%);
      /* Chrome that costs no layout: an inset hairline around the viewport. */
      box-shadow: inset 0 0 0 1px var(--frame-edge), inset 0 0 60px rgba(0, 0, 0, 0.55);
    }
    #stage-wrap,
    #game-frame,
    #game-container {
      position: absolute;
      inset: 0;
    }
    #game-container {
      line-height: 0;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Optional CRT scanline overlay, toggled from the in-game Settings menu. */
    #scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        rgba(255, 255, 255, 0.02) 1px,
        rgba(255, 255, 255, 0.02) 3px
      );
      mix-blend-mode: multiply;
    }
    #scanlines.on { opacity: 1; }
    /*
     * Key hints overlay the canvas instead of sitting under it: the play area
     * owns the whole viewport. It is non-interactive, and every scene keeps its
     * own bottom-edge HUD clear of it.
     */
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 3px 12px 5px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #8e9ab4;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(4, 6, 10, 0.86) 0%,
        rgba(4, 6, 10, 0.4) 65%,
        rgba(4, 6, 10, 0) 100%
      );
    }
    #hint b { color: var(--accent); font-weight: 600; }
    #boot-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffb4b4;
      background: rgba(10, 6, 8, 0.9);
      font-size: 14px;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      #hint { font-size: 10px; padding: 2px 8px 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <div id="game-frame">
        <div id="game-container">
          <div id="scanlines"></div>
          <div id="boot-error"></div>
        </div>
      </div>
    </div>
    <div id="hint">
      <span><b>Move</b> WASD / Arrows</span> &nbsp;·&nbsp;
      <span><b>Confirm / Interact</b> Enter, Space, E</span> &nbsp;·&nbsp;
      <span><b>Menu / Back</b> Esc</span> &nbsp;·&nbsp;
      <span><b>Battle</b> 1-5 quick commands</span> &nbsp;·&nbsp;
      <span><b>Save</b> Esc &rarr; Save</span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
